<!DOCTYPE html>
<html>
<head>
  <title>brushify</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      margin-top: 30px;
    }

    #myBox {
      width: 280px;
      height: 170px;
      background-color: #d1fae5;
      color: #164e63;
      border: 2px solid #0f766e;
      margin: 20px auto;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      cursor: text;
      word-break: break-word;
    }

    .main-controls {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 65px;
      height: 32px;
      border: 1px solid #555;
      cursor: pointer;
      margin: 3px;
      border-radius: 5px;
    }

    .f-btn {
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #64748b;
      background-color: white;
      border-radius: 5px;
      margin: 3px;
    }
  </style>
</head>

<body>

  <div id="myBox" contenteditable="true">Heloo</div>

  <div class="main-controls">

    <div>
      <h4>Background Color</h4>

      <button class="color-btn"
        style="background-color:#d1fae5"
        onclick="changeBg('#d1fae5')">Mint</button>

      <button class="color-btn"
        style="background-color:#bfdbfe"
        onclick="changeBg('#bfdbfe')">Blue</button>

      <button class="color-btn"
        style="background-color:#fbcfe8"
        onclick="changeBg('#fbcfe8')">Pink</button>

    </div>

    <div>
      <h4>Font Color</h4>

      <button class="color-btn"
        style="background-color:#164e63; color:white"
        onclick="changeText('#164e63')">Navy</button>

      <button class="color-btn"
        style="background-color:#7e22ce; color:white"
        onclick="changeText('#7e22ce')">Purple</button>

      <button class="color-btn"
        style="background-color:#b91c1c; color:white"
        onclick="changeText('#b91c1c')">Red</button>

    </div>

    <div>
      <h4>Font Style</h4>

      <button class="f-btn"
        onclick="changeFont('Arial')">Arial</button>

      <button class="f-btn"
        onclick="changeFont('Georgia')">Georgia</button>

      <button class="f-btn"
        onclick="changeFont('Courier New')">Courier</button>

    </div>

  </div>

  <script>
    var box = document.getElementById("myBox");

    function changeBg(colorName) {
      box.style.backgroundColor = colorName;
    }

    function changeText(textColor) {
      box.style.color = textColor;
    }

    function changeFont(fontName) {
      box.style.fontFamily = fontName;
    }
  </script>

</body>
</html>
